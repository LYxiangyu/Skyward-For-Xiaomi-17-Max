[device]
codename = "byron"
brand = "Xiaomi"
model = "Xiaomi 17 Max"
ab = true
soc = { hans = "第五代骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite Gen 5 行動平台", en = "Snapdragon® 8 Elite Gen 5 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# the byron panel's own mode in the device tree.
width = 1200
height = 2608
density = 480

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The QTI secure-element HAL uses /dev/nq-nci to identify the NXP chip;
# NFC userspace is not needed for decryption.
load = ["synaptics_tcm2", "nxp-nci"]

[[owners]]
user = "nfc"
group = "nfc"
mode = 0o660
paths = ["/dev/nq-nci"]

# NXP Weaver needs Android 17's native OMAPI broker, which neither the stock
# recovery nor the mounted system carries.
[[ramdisk_file]]
path = "system/bin/se_omapi"
source = "byron/se_omapi"
mode = 0o755

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted, as
# the 17 Ultra's does.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN's MAC address is there.
[partitions]
mounted = ["persist"]

# Its stock recovery leaves out libsysutils and libcap, which the
# recovery's own logd loads, as the 17 Ultra's does.
[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The opener used by programs that reach the secure world's apps through
# the GlobalPlatform TEE client interface.
[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# The default hardware-backed key service. The same process also registers
# the secure clock, shared secret and remote provisioning services described
# separately by the phone's VINTF manifests.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.onekeymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The credential service verifies the screen lock and returns the
# authentication token KeyMint needs for keys protected by that lock.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-rust-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# Dropping from root to the Weaver account makes Android's linker ignore
# LD_LIBRARY_PATH. Put the two libraries absent from the recovery in its
# default library directory before starting Weaver. /system is the
# recovery's ramdisk here; neither copy writes the installed system.
[[service]]
path = "/system/bin/cp"
args = ["/mnt/system/system/lib64/libvndksupport.so", "/system/lib64/libvndksupport.so"]
oneshot = true

[[service]]
path = "/system/bin/cp"
args = ["/mnt/system/system/lib64/bootstrap/libdl_android.so", "/system/lib64/libdl_android.so"]
oneshot = true

[[service]]
path = "/system/bin/chmod"
args = ["0644", "/system/lib64/libvndksupport.so", "/system/lib64/libdl_android.so"]
oneshot = true

# QTI's HAL opens the NXP secure element through GPQeSE. The NXP NFC daemon
# is deliberately not started: the kernel node is enough for chip detection.
[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
description = "/odm/etc/vintf/manifest/nfc2-service-nxp.xml"

# The native broker exposes the eSE1 reader through OMAPI to Weaver.
[[service]]
path = "/system/bin/se_omapi"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
ready_service = "android.se.omapi.ISecureElementService/default"
description = "/vendor/etc/vintf/manifest/secure_element-service.xml"

# The screen-lock protector is kept by the phone's NXP secure element. Its
# VINTF description spells the interface and instance in separate elements,
# so name the file explicitly rather than relying on the compact-name match.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp-qti"
ready_service = "android.hardware.weaver.IWeaver/default"
description = "/odm/etc/vintf/manifest/android.hardware.weaver-service.nxp.xml"
user = "vendor_nxp_weaver"
groups = ["vendor_nxp_weaver"]

# Boot control tells Skyward which slot starts next and lets it switch the
# active slot. The stock recovery's init description names this service but
# does not start it automatically, so run the same recovery-specific binary
# here and wait until its AIDL service is registered.
[[service]]
path = "/system/bin/hw/android.hardware.boot-service.qti.recovery"
init_service = "vendor.boot-qti"
ready_service = "android.hardware.boot.IBootControl/default"

# WLAN: the peach node in the device tree, driven by qca_cld3_peach_v2, the
# one Peach driver the phone's own modules.load lists, as on the 17 Ultra.
# Its cfg80211 asks for rfkill, one of the kernel's own modules in
# system_dlkm. The driver reads its settings and the MAC address through
# the firmware loader, from links the vendor partition keeps in its own
# firmware folder, into the vendor partition and into persist.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS4.0.3.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.3.0.XAFCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.3.0.XAFCNXM/byron-ota_full-OS4.0.3.0.XAFCNXM-user-17.0-4c96d596f9.zip"
recovery = "0542a553376a6a87e84cb7841f9588e7a609e9a6db1a507d9bc34116276a1b8f"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), with the click made from
# samples at the motor's resonant frequency as on the 17 Ultra. The
# strengths are the 17 Ultra's, which were felt on that phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
